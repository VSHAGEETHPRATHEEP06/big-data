# Prometheus: scrapes every pipeline stage. The "stage" label groups targets
# by Lambda layer so dashboards and alerts can say where a problem is.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    project: fleetpulse

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: stream-producer
    static_configs:
      - targets: ["stream-producer:8000"]
        labels: {stage: ingestion}
  - job_name: batch-producer
    static_configs:
      - targets: ["batch-producer:8000"]
        labels: {stage: ingestion}
  - job_name: spark-speed-layer
    static_configs:
      - targets: ["spark-streaming:9108"]
        labels: {stage: processing}
  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]
        labels: {stage: orchestration}
  - job_name: serving-api
    static_configs:
      - targets: ["api:8000"]
        labels: {stage: serving}
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {stage: observability}
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: {stage: observability}
