# Spark JVM logs as JSON lines (Spark's own template), WARN and above.
# Python code of the jobs logs through fleet_common.logs, also as JSON.
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = JsonTemplateLayout
appender.console.layout.eventTemplateUri = classpath:org/apache/spark/SparkLayout.json

# The Kafka client is chatty at WARN during broker start-up
logger.kafka.name = org.apache.kafka
logger.kafka.level = error
