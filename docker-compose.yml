# FleetPulse: ride-hailing fleet analytics on a Lambda architecture.
#
#   docker compose up -d --build        start everything
#   docker compose ps                   health of every service
#   docker compose down -v              stop and delete all data
#
# Memory limits are sized for Docker Desktop with about 4 GB of RAM.
# No service bind-mounts host folders: every config file is baked into an
# image at build time, so the stack runs the same on any machine.
name: fleetpulse

x-fleet-env: &fleet-env
  SIM_SPEEDUP: ${SIM_SPEEDUP:-120}
  SIM_START: ${SIM_START:-2026-09-01T06:00:00}
  SIM_SEED: ${SIM_SEED:-2026}
  KAFKA_BOOTSTRAP: kafka:9092
  TOPIC_TELEMETRY: fleet.telemetry.raw
  TOPIC_DLQ: fleet.telemetry.dlq
  TELEMETRY_PARTITIONS: "6"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-fleet}
  POSTGRES_USER: ${POSTGRES_USER:-fleet}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_pw}
  DATA_DIR: /data
  CONFIG_DIR: /opt/fleet/config
  TICK_SECONDS: ${TICK_SECONDS:-1.0}
  INVALID_EVENT_RATE: ${INVALID_EVENT_RATE:-0.005}
  DUPLICATE_EVENT_RATE: ${DUPLICATE_EVENT_RATE:-0.01}
  OUTAGE_RATE_PER_SIM_HOUR: ${OUTAGE_RATE_PER_SIM_HOUR:-0.03}
  EXPENSE_FAULT_RATE: ${EXPENSE_FAULT_RATE:-0.6}
  LATE_FILE_RATE: ${LATE_FILE_RATE:-0.0}
  FUEL_PRICE_LKR: ${FUEL_PRICE_LKR:-305}
  WATERMARK_MINUTES: ${WATERMARK_MINUTES:-10}
  SPEED_TRIGGER_SECONDS: ${SPEED_TRIGGER_SECONDS:-5}
  AGGREGATE_TRIGGER_SECONDS: ${AGGREGATE_TRIGGER_SECONDS:-10}
  ARCHIVE_TRIGGER_SECONDS: ${ARCHIVE_TRIGGER_SECONDS:-30}
  IDLE_ALERT_MINUTES: ${IDLE_ALERT_MINUTES:-90}
  OFFLINE_AFTER_MINUTES: ${OFFLINE_AFTER_MINUTES:-30}
  DRIVER_SHARE: ${DRIVER_SHARE:-0.30}
  AT_RISK_MARGIN_PCT: ${AT_RISK_MARGIN_PCT:-15}
  DISTANCE_GAP_ALERT_PCT: ${DISTANCE_GAP_ALERT_PCT:-15}
  LOW_TRIPS_FACTOR: ${LOW_TRIPS_FACTOR:-0.6}
  HIGH_FUEL_COST_FACTOR: ${HIGH_FUEL_COST_FACTOR:-1.25}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: UTC

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- storage
  volume-init:
    image: python:3.12-slim
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/landing/expenses /data/lake/raw /data/lake/curated
        /data/checkpoints /data/sim_state/ground_truth /data/reports &&
        chown -R 50000:0 /data && chmod -R ug+rwX /data &&
        chown -R 1000:1000 /kafka-data
    volumes:
      - fleet-data:/data
      - kafka-data:/kafka-data
    logging: *logging

  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: fleetpulse/postgres:1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_pw}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pw}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_pw}
    command: >-
      postgres -c shared_buffers=64MB -c max_connections=80 -c work_mem=4MB
      -c timezone=UTC -c log_min_duration_statement=2000
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # -------------------------------------------------------------- ingestion
  # Official Apache Kafka 4.3 image compiled ahead of time with GraalVM
  # (about 170 MB of RAM instead of about 400 MB for the JVM image). The JVM image
  # apache/kafka:4.3.1 is a drop-in replacement for production-like runs.
  kafka:
    image: apache/kafka-native:4.3.1
    hostname: kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging

  kafka-init:
    build:
      context: .
      dockerfile: simulators/Dockerfile
    image: fleetpulse/simulators:1.0
    command: ["python", "create_topics.py"]
    environment: *fleet-env
    depends_on:
      kafka:
        condition: service_healthy
    logging: *logging

  stream-producer:
    build:
      context: .
      dockerfile: simulators/Dockerfile
    image: fleetpulse/simulators:1.0
    command: ["python", "stream_producer.py"]
    init: true
    environment:
      <<: *fleet-env
      METRICS_PORT: "8000"
    volumes:
      - fleet-data:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    restart: unless-stopped
    logging: *logging

  batch-producer:
    build:
      context: .
      dockerfile: simulators/Dockerfile
    image: fleetpulse/simulators:1.0
    command: ["python", "batch_producer.py"]
    init: true
    environment:
      <<: *fleet-env
      METRICS_PORT: "8000"
    volumes:
      - fleet-data:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  # ------------------------------------------------------------- processing
  spark-streaming:
    build:
      context: .
      dockerfile: spark/Dockerfile
      target: runtime
    image: fleetpulse/spark:1.0
    command: ["python", "speed_layer.py"]
    init: true
    environment: *fleet-env
    volumes:
      - fleet-data:/data
    ports:
      - "4040:4040"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9108/metrics', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1280m
    restart: unless-stopped
    logging: *logging

  # ----------------------------------------------------------- orchestration
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: fleetpulse/airflow:1.0
    command: ["bash", "/opt/fleet/airflow/start-airflow.sh"]
    environment:
      <<: *fleet-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_pw}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # the DAG is a straight line, so one task at a time is enough (saves memory)
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "120"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:-admin}:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - fleet-data:/data
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      statsd-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "-o", "/dev/null", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 1800m
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------------- serving
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: fleetpulse/api:1.0
    init: true
    environment: *fleet-env
    volumes:
      - fleet-data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------- observability
  prometheus:
    build: ./observability/prometheus
    image: fleetpulse/prometheus:1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 300m
    restart: unless-stopped
    logging: *logging

  alertmanager:
    build: ./observability/alertmanager
    image: fleetpulse/alertmanager:1.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    mem_limit: 96m
    restart: unless-stopped
    logging: *logging

  statsd-exporter:
    build: ./observability/statsd
    image: fleetpulse/statsd-exporter:1.0
    command:
      - --statsd.mapping-config=/etc/statsd/mapping.yml
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  grafana:
    build: ./observability/grafana
    image: fleetpulse/grafana:1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/fleet_live.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      FLEET_DB: ${POSTGRES_DB:-fleet}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_pw}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 400m
    restart: unless-stopped
    logging: *logging

  # ------------------------------------------------------------------ tests
  tests:
    build:
      context: .
      dockerfile: spark/Dockerfile
      target: test
    image: fleetpulse/tests:1.0
    profiles: ["test"]
    environment:
      TZ: UTC
      CONFIG_DIR: /opt/fleet/config

volumes:
  fleet-data:
  pg-data:
  kafka-data:
  airflow-logs:
  prometheus-data:
